name: Automated News Fetcher & Publisher

on:
  schedule:
    - cron: '*/10 * * * *' # Runs every 10 minutes 24/7 automatically even when offline
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run News Fetcher Script
        run: |
          if [ -f "scripts/fetch-news.mjs" ]; then
            node scripts/fetch-news.mjs
          elif [ -f "auto_fetch_news.js" ]; then
            node auto_fetch_news.js
          else
            echo "No fetch script found!"
          fi

      - name: Commit and push if there are changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json index.html || true
          git diff --staged --quiet || (git commit -m "feed(news): auto-sync latest updates every 10m [skip ci]" && git push)
