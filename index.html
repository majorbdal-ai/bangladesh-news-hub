<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলাদেশ নিউজ হাব | Bangladesh News Hub</title>
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #0f172a; color: #f8fafc; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col" x-data="newsPortal()">

    <!-- Top Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 px-4 py-4">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 text-white w-10 h-10 rounded-xl flex items-center justify-center text-xl font-bold">
                    <i class="fa-solid fa-newspaper"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white" x-text="lang === 'bn' ? 'বাংলাদেশ নিউজ হাব' : 'Bangladesh News Hub'"></h1>
                    <p class="text-xs text-emerald-400 font-semibold" x-text="lang === 'bn' ? '১০০% ইন-সাইট নিউজ পোর্টাল' : '100% In-Site News Portal'"></p>
                </div>
            </div>

            <!-- Problem Area 1: Header Control Buttons -->
            <div class="flex items-center space-x-3">
                <button @click="loadNews()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg flex items-center space-x-2 cursor-pointer">
                    <i class="fa-solid fa-rotate" :class="{ 'fa-spin': loading }"></i>
                    <span x-text="lang === 'bn' ? 'রিয়েল-টাইম সিংক' : 'Live Sync'"></span>
                </button>
                <button @click="lang = lang === 'bn' ? 'en' : 'bn'" class="bg-slate-800 hover:bg-slate-700 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg flex items-center space-x-2 cursor-pointer border border-slate-700">
                    <i class="fa-solid fa-globe text-emerald-400"></i>
                    <span x-text="lang === 'bn' ? 'English' : 'বাংলা'"></span>
                </button>
                <button @click="darkMode = !darkMode" class="bg-slate-800 hover:bg-slate-700 text-white w-10 h-10 rounded-xl font-bold text-sm shadow-lg flex items-center justify-center cursor-pointer border border-slate-700">
                    <i class="fa-solid" :class="darkMode ? 'fa-sun text-yellow-400' : 'fa-moon text-slate-300'"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <!-- Loading -->
        <div x-show="loading" class="text-center py-20 text-emerald-400 font-bold text-lg">সংবাদ লোড হচ্ছে...</div>

        <template x-if="!loading">
            <div>
                <!-- Problem Area 2: Hero Featured Banner -->
                <div class="bg-gradient-to-r from-emerald-900 via-teal-900 to-slate-900 rounded-3xl p-8 mb-10 text-white shadow-2xl border border-emerald-500/30" x-show="heroItem">
                    <span class="bg-emerald-500 text-slate-950 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-3 inline-block">প্রধান সংবাদ</span>
                    <h2 class="text-2xl sm:text-4xl font-bold mb-4" x-text="heroItem ? heroItem.title : ''"></h2>
                    <p class="text-slate-300 text-sm sm:text-base mb-6 max-w-2xl line-clamp-2" x-text="heroItem ? heroItem.summary : ''"></p>
                    <button @click="openModal(heroItem)" class="bg-white hover:bg-emerald-50 text-slate-950 px-8 py-3.5 rounded-xl font-bold text-base shadow-xl flex items-center space-x-2 cursor-pointer">
                        <span x-text="lang === 'bn' ? 'সম্পূর্ণ সংবাদ পড়ুন' : 'Read Full Report'"></span>
                        <i class="fa-solid fa-arrow-right text-emerald-600"></i>
                    </button>
                </div>

                <!-- Problem Area 3: Category Filter Buttons -->
                <div class="flex items-center space-x-3 overflow-x-auto pb-4 mb-8">
                    <button @click="selectCategory('all')" :class="selectedCategory === 'all' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="px-5 py-3 rounded-xl font-bold text-sm whitespace-nowrap shadow-md cursor-pointer border border-slate-700">
                        <span x-text="lang === 'bn' ? 'সকল খবর' : 'All News'"></span> (<span x-text="newsList.length"></span>)
                    </button>
                    <template x-for="cat in availableCategories()" :key="cat.id">
                        <button @click="selectCategory(cat.id)" :class="selectedCategory === cat.id ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="px-5 py-3 rounded-xl font-bold text-sm whitespace-nowrap shadow-md cursor-pointer border border-slate-700">
                            <span x-text="lang === 'bn' ? cat.bn : cat.en"></span> (<span x-text="categoryCount(cat.id)"></span>)
                        </button>
                    </template>
                </div>

                <!-- News Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    <template x-for="item in visibleNews()" :key="item.id">
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col shadow-lg">
                            <div class="h-48 bg-slate-800 relative">
                                <img x-show="item.image" :src="item.image" class="w-full h-full object-cover" @error="item.image = ''">
                                <span class="absolute top-3 left-3 bg-slate-950/80 text-white text-xs font-bold px-3 py-1 rounded-lg" x-text="lang === 'bn' ? item.categoryBn : item.category"></span>
                            </div>
                            <div class="p-5 flex flex-col flex-1">
                                <h3 class="font-bold text-base mb-2 line-clamp-2 text-white" x-text="item.title"></h3>
                                <p class="text-sm text-slate-400 line-clamp-2 mb-4 flex-1" x-text="item.summary"></p>
                                <div class="flex items-center justify-between pt-4 border-t border-slate-800">
                                    <span class="text-xs text-emerald-400 font-semibold" x-text="item.source"></span>
                                    <button @click="openModal(item)" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold cursor-pointer shadow">
                                        <span x-text="lang === 'bn' ? 'বিস্তারিত পড়ুন' : 'Read Full'"></span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Load More -->
                <div class="flex justify-center mt-10" x-show="visibleCount < filteredNews().length">
                    <button @click="visibleCount += 24" class="bg-emerald-600 hover:bg-emerald-500 text-white px-8 py-3.5 rounded-xl font-bold text-sm cursor-pointer shadow-lg">
                        <span x-text="lang === 'bn' ? 'আরও খবর দেখুন' : 'Load More'"></span>
                    </button>
                </div>
            </div>
        </template>
    </main>

    <!-- Modal Reader -->
    <div x-show="activeArticle" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-3xl rounded-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-950">
                <span class="text-sm font-bold text-emerald-400" x-text="activeArticle ? activeArticle.source : ''"></span>
                <button @click="closeModal()" class="bg-slate-800 hover:bg-slate-700 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold cursor-pointer">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4 flex-1 text-slate-200">
                <h2 class="text-xl sm:text-2xl font-bold" x-text="activeArticle ? activeArticle.title : ''"></h2>
                <div class="h-64 rounded-xl overflow-hidden bg-slate-800" x-show="activeArticle && activeArticle.image">
                    <img :src="activeArticle ? activeArticle.image : ''" class="w-full h-full object-cover">
                </div>
                <div class="text-base leading-relaxed space-y-3" x-html="activeArticle ? (activeArticle.content || activeArticle.summary) : ''"></div>
            </div>
            <div class="px-6 py-4 border-t border-slate-800 bg-slate-950 flex justify-end">
                <button @click="closeModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-xl font-bold text-sm cursor-pointer">
                    বন্ধ করুন
                </button>
            </div>
        </div>
    </div>

    <script>
        function newsPortal() {
            return {
                lang: 'bn',
                darkMode: true,
                loading: true,
                newsList: [],
                selectedCategory: 'all',
                searchQuery: '',
                visibleCount: 24,
                activeArticle: null,
                categoryMeta: {
                    national: { en: 'National', bn: 'জাতীয়' },
                    politics: { en: 'Politics', bn: 'রাজনীতি' },
                    international: { en: 'International', bn: 'আন্তর্জাতিক' },
                    business: { en: 'Business', bn: 'বাণিজ্য' },
                    sports: { en: 'Sports', bn: 'খেলাধুলা' },
                    entertainment: { en: 'Entertainment', bn: 'বিনোদন' },
                    technology: { en: 'Technology', bn: 'প্রযুক্তি' },
                    education: { en: 'Education', bn: 'শিক্ষা' },
                    health: { en: 'Health', bn: 'স্বাস্থ্য' },
                    opinion: { en: 'Opinion', bn: 'মতামত' }
                },
                init() {
                    this.loadNews();
                },
                async loadNews() {
                    this.loading = true;
                    try {
                        const res = await fetch('data/news.json', { cache: 'no-store' });
                        const data = await res.json();
                        this.newsList = Array.isArray(data.items) ? data.items : [];
                    } catch (e) {
                        this.newsList = [];
                    } finally {
                        this.loading = false;
                    }
                },
                openModal(item) { this.activeArticle = item; document.body.style.overflow = 'hidden'; },
                closeModal() { this.activeArticle = null; document.body.style.overflow = 'auto'; },
                get heroItem() { return this.newsList.length ? this.newsList[0] : null; },
                selectCategory(id) { this.selectedCategory = id; this.visibleCount = 24; },
                availableCategories() {
                    const present = new Set(this.newsList.map(n => n.category));
                    return Object.keys(this.categoryMeta)
                        .filter(id => present.has(id))
                        .map(id => ({ id, en: this.categoryMeta[id].en, bn: this.categoryMeta[id].bn }));
                },
                categoryCount(id) { return this.newsList.filter(n => n.category === id).length; },
                filteredNews() {
                    return this.newsList.filter(item => {
                        const matchesCat = this.selectedCategory === 'all' || item.category === this.selectedCategory;
                        const query = this.searchQuery.toLowerCase();
                        const matchesSearch = !query || item.title.toLowerCase().includes(query);
                        return matchesCat && matchesSearch;
                    });
                },
                visibleNews() { return this.filteredNews().slice(0, this.visibleCount); }
            }
        }
    </script>
</body>
</html>
