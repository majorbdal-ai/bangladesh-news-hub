<!DOCTYPE html>
<html lang="bn" x-data="newsPortal()" x-init="init()" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলাদেশ ক্রনিকল | Bangladesh Chronicle — Live Bangladesh News</title>
    <meta name="description" content="বাংলাদেশের সব সংবাদমাধ্যমের সর্বশেষ খবর এক জায়গায় — জাতীয়, রাজনীতি, আন্তর্জাতিক, খেলাধুলা, অর্থনীতি, বিনোদন ও প্রযুক্তি।">
    <link rel="icon" type="image/png" href="assets/logo-tile-preview.png">
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600&display=swap" rel="stylesheet">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif; }
        .font-serif-title { font-family: 'Playfair Display', serif; }

        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-header { background: rgba(11, 15, 25, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(30, 41, 59, 0.8); }

        .elite-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .dark .elite-card { background: #111827; border: 1px solid #1f2937; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        .elite-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08); border-color: #059669; }

        .hero-gradient { background: linear-gradient(135deg, #022c22 0%, #064e3b 50%, #0f172a 100%); }

        .cat-pill { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .cat-pill:hover { transform: translateY(-2px); }

        .img-fallback { display: flex; align-items: center; justify-content: center; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .scrollbar-none::-webkit-scrollbar { display: none; }

        [x-cloak] { display: none !important; }

        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 1s linear infinite; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <!-- Header -->
    <header class="glass-header sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img src="assets/logo-tile-preview.png" alt="Bangladesh Chronicle" class="w-10 h-10 rounded-xl object-cover">
                <div>
                    <h1 class="font-serif-title font-extrabold text-lg sm:text-xl leading-none" x-text="lang === 'bn' ? 'বাংলাদেশ ক্রনিকল' : 'Bangladesh Chronicle'">বাংলাদেশ ক্রনিকল</h1>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium" x-text="lastUpdatedLabel"></p>
                </div>
            </div>
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button @click="lang = lang === 'bn' ? 'en' : 'bn'" class="w-10 h-10 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-extrabold hover:bg-slate-100 dark:hover:bg-slate-800 transition" x-text="lang === 'bn' ? 'EN' : 'বাং'"></button>
                <button @click="darkMode = !darkMode" class="w-10 h-10 rounded-xl border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i class="fa-solid" :class="darkMode ? 'fa-sun' : 'fa-moon'"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Hero: shows the latest fetched headline, not a fixed made-up one -->
        <div class="hero-gradient rounded-3xl p-6 sm:p-10 lg:p-14 text-white mb-10 relative overflow-hidden" x-show="heroItem" x-cloak>
            <div class="relative z-10 max-w-3xl">
                <div class="flex items-center flex-wrap gap-3 mb-4">
                    <span class="bg-emerald-500 text-slate-950 text-xs font-extrabold px-3.5 py-1 rounded-full uppercase tracking-wider">
                        <i class="fa-solid fa-star mr-1"></i> <span x-text="lang === 'bn' ? 'সর্বশেষ' : 'Latest'"></span>
                    </span>
                    <span class="text-xs text-slate-300 font-medium" x-show="heroItem">
                        <i class="fa-regular fa-clock mr-1"></i> <span x-text="heroItem ? timeAgo(heroItem.pubDate) : ''"></span>
                    </span>
                    <span class="text-xs text-slate-300 font-medium" x-show="heroItem" x-text="heroItem ? heroItem.source : ''"></span>
                </div>
                <h2 class="text-xl sm:text-3xl lg:text-4xl font-extrabold font-serif-title leading-tight mb-4" x-text="heroItem ? heroItem.title : ''"></h2>
                <p class="text-slate-300 text-sm sm:text-base leading-relaxed font-normal mb-8 max-w-2xl line-clamp-3" x-text="heroItem ? heroItem.summary : ''"></p>
                <a :href="heroItem ? heroItem.link : '#'" target="_blank" rel="noopener noreferrer" class="inline-flex bg-white text-slate-900 hover:bg-emerald-50 px-7 py-3.5 rounded-2xl text-sm font-extrabold transition shadow-xl items-center space-x-2 cursor-pointer">
                    <span x-text="lang === 'bn' ? 'পূর্ণ প্রতিবেদন পড়ুন' : 'Read Full Report'"></span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs ml-2"></i>
                </a>
            </div>
        </div>

        <!-- Loading state -->
        <div x-show="loading" x-cloak class="flex flex-col items-center justify-center py-24 text-slate-500 dark:text-slate-400">
            <i class="fa-solid fa-circle-notch spin text-3xl mb-4 text-emerald-600"></i>
            <p x-text="lang === 'bn' ? 'সর্বশেষ খবর লোড হচ্ছে...' : 'Loading latest news...'"></p>
        </div>

        <!-- Error / empty state -->
        <div x-show="!loading && newsList.length === 0" x-cloak class="text-center py-24 bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800">
            <i class="fa-solid fa-newspaper text-4xl text-slate-300 dark:text-slate-700 mb-4"></i>
            <p class="text-slate-500 dark:text-slate-400 font-medium" x-text="lang === 'bn' ? 'এখনো কোনো খবর যোগ হয়নি। প্রথম অটো-আপডেট সম্পন্ন হলে এখানে খবর দেখা যাবে।' : 'No news yet. Once the first automated update runs, headlines will appear here.'"></p>
        </div>

        <template x-if="!loading && newsList.length > 0">
            <div>
                <!-- Category pills + search -->
                <div class="flex flex-col lg:flex-row gap-6 justify-between items-center mb-10 bg-white dark:bg-slate-900 p-5 lg:p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl shadow-slate-200/50 dark:shadow-none">
                    <div class="flex items-center space-x-2.5 overflow-x-auto pb-2 lg:pb-0 w-full lg:w-auto scrollbar-none">
                        <button @click="selectCategory('all')"
                            :class="selectedCategory === 'all' ? 'bg-slate-900 dark:bg-emerald-600 text-white shadow-xl shadow-slate-900/20 border-slate-900 scale-105' : 'bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-700'"
                            class="cat-pill px-5 py-3 rounded-2xl text-xs sm:text-sm font-extrabold whitespace-nowrap transition-all duration-300 flex items-center space-x-2.5 group cursor-pointer shadow-sm">
                            <span class="w-7 h-7 rounded-xl flex items-center justify-center transition"
                                :class="selectedCategory === 'all' ? 'bg-white/20 text-white' : 'bg-slate-100 dark:bg-slate-900 text-slate-900 dark:text-emerald-400 group-hover:scale-110'">
                                <i class="fa-solid fa-globe"></i>
                            </span>
                            <span x-text="lang === 'bn' ? 'সকল খবর' : 'All News'"></span>
                            <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ml-1"
                                :class="selectedCategory === 'all' ? 'bg-white/20 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300'"
                                x-text="newsList.length"></span>
                        </button>
                        <template x-for="cat in availableCategories()" :key="cat.id">
                            <button @click="selectCategory(cat.id)"
                                :class="selectedCategory === cat.id ? 'bg-slate-900 dark:bg-emerald-600 text-white shadow-xl shadow-slate-900/20 border-slate-900 scale-105' : 'bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-700'"
                                class="cat-pill px-5 py-3 rounded-2xl text-xs sm:text-sm font-extrabold whitespace-nowrap transition-all duration-300 flex items-center space-x-2.5 group cursor-pointer shadow-sm">
                                <span class="w-7 h-7 rounded-xl flex items-center justify-center transition"
                                    :class="selectedCategory === cat.id ? 'bg-white/20 text-white' : 'bg-slate-100 dark:bg-slate-900 text-slate-900 dark:text-emerald-400 group-hover:scale-110'">
                                    <i :class="cat.icon"></i>
                                </span>
                                <span x-text="lang === 'bn' ? cat.bn : cat.en"></span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ml-1"
                                    :class="selectedCategory === cat.id ? 'bg-white/20 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300'"
                                    x-text="categoryCount(cat.id)"></span>
                            </button>
                        </template>
                    </div>
                    <div class="relative w-full lg:w-72">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" x-model="searchQuery"
                            :placeholder="lang === 'bn' ? 'খবর খুঁজুন...' : 'Search news...'"
                            class="w-full pl-11 pr-4 py-3 rounded-2xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>

                <!-- News grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    <template x-for="item in visibleNews()" :key="item.id">
                        <div @click="openModal(item)" class="elite-card rounded-3xl overflow-hidden flex flex-col cursor-pointer group">
                            <div class="h-44 w-full overflow-hidden relative">
                                <img x-show="item.image" :src="item.image" :alt="item.title" loading="lazy"
                                     class="w-full h-full object-cover group-hover:scale-105 transition duration-500"
                                     @error="item.image = ''">
                                <div x-show="!item.image" class="img-fallback w-full h-full" :class="categoryColor(item.category)">
                                    <i class="text-4xl text-white/70" :class="categoryIcon(item.category)"></i>
                                </div>
                                <span class="absolute top-3 left-3 bg-slate-950/80 backdrop-blur text-white text-[11px] font-bold px-3 py-1 rounded-full" x-text="lang === 'bn' ? item.categoryBn : categoryEn(item.category)"></span>
                            </div>
                            <div class="p-5 flex flex-col flex-1">
                                <h3 class="font-bold text-base leading-snug mb-2 line-clamp-2 group-hover:text-emerald-600 transition" x-text="item.title"></h3>
                                <p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed line-clamp-2 mb-4 flex-1" x-text="item.summary"></p>
                                <div class="flex items-center justify-between text-xs font-medium pt-3 border-t border-slate-100 dark:border-slate-800 mt-2">
                                    <span class="text-slate-500 dark:text-slate-400" x-text="item.source"></span>
                                    <span class="bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-xl text-xs group-hover:bg-emerald-700 transition shadow-sm" x-text="lang === 'bn' ? 'বিস্তারিত পড়ুন' : 'Read Full'"></span>
                                </div>
                            </div>
                        </a>
                    </template>
                </div>

                <!-- No results for search/category -->
                <div x-show="filteredNews().length === 0" x-cloak class="text-center py-16 text-slate-500 dark:text-slate-400">
                    <i class="fa-solid fa-magnifying-glass text-3xl mb-3 text-slate-300 dark:text-slate-700"></i>
                    <p x-text="lang === 'bn' ? 'কোনো খবর পাওয়া যায়নি' : 'No matching news found'"></p>
                </div>

                <!-- Load more -->
                <div class="flex justify-center mt-10" x-show="visibleCount < filteredNews().length" x-cloak>
                    <button @click="visibleCount += 24" class="bg-slate-900 dark:bg-emerald-600 text-white px-8 py-3.5 rounded-2xl text-sm font-extrabold hover:bg-slate-800 dark:hover:bg-emerald-500 transition shadow-lg">
                        <span x-text="lang === 'bn' ? 'আরও খবর দেখুন' : 'Load More'"></span>
                        <i class="fa-solid fa-chevron-down ml-2 text-xs"></i>
                    </button>
                </div>
            </div>
        </template>
    </main>

    <footer class="border-t border-slate-200 dark:border-slate-800 mt-16 py-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-slate-500 dark:text-slate-400">
            <p x-text="lang === 'bn' ? 'বাংলাদেশের প্রধান সংবাদমাধ্যমগুলোর আপডেট থেকে সংগৃহীত। সমস্ত সংবাদ ও বিস্তারিত প্রতিবেদন সরাসরি এই ওয়েবসাইটেই পঠিত হয় — অন্য কোনো সাইটে যাওয়ার প্রয়োজন নেই।' : 'Aggregated from major Bangladeshi news sources. All news and full reports are read directly here on this website — no external links required.'"></p>
        </div>
    </footer>

    <script>
        function newsPortal() {
            return {
                lang: localStorage.getItem('bnc_lang') || 'bn',
                darkMode: localStorage.getItem('bnc_dark') === 'true',
                loading: true,
                newsList: [],
                activeArticle: null,
                openModal(item) { this.activeArticle = item; document.body.style.overflow = 'hidden'; },
                closeModal() { this.activeArticle = null; document.body.style.overflow = 'auto'; },
                generatedAt: null,
                selectedCategory: 'all',
                searchQuery: '',
                visibleCount: 24,

                categoryMeta: {
                    national:      { en: 'National',        icon: 'fa-solid fa-flag',            color: 'bg-emerald-700' },
                    politics:      { en: 'Politics',        icon: 'fa-solid fa-landmark',         color: 'bg-slate-700' },
                    international: { en: 'International',   icon: 'fa-solid fa-earth-asia',       color: 'bg-sky-700' },
                    business:      { en: 'Business',        icon: 'fa-solid fa-chart-line',       color: 'bg-amber-700' },
                    sports:        { en: 'Sports',          icon: 'fa-solid fa-futbol',           color: 'bg-orange-700' },
                    entertainment: { en: 'Entertainment',   icon: 'fa-solid fa-clapperboard',     color: 'bg-pink-700' },
                    technology:    { en: 'Technology',      icon: 'fa-solid fa-microchip',        color: 'bg-indigo-700' },
                    education:     { en: 'Education',       icon: 'fa-solid fa-graduation-cap',   color: 'bg-teal-700' },
                    health:        { en: 'Health',          icon: 'fa-solid fa-heart-pulse',      color: 'bg-rose-700' },
                    opinion:       { en: 'Opinion',         icon: 'fa-solid fa-comment-dots',     color: 'bg-purple-700' },
                },

                init() {
                    this.$watch('lang', v => localStorage.setItem('bnc_lang', v));
                    this.$watch('darkMode', v => localStorage.setItem('bnc_dark', v));
                    this.loadNews();
                },

                async loadNews() {
                    this.loading = true;
                    try {
                        const res = await fetch('data/news.json', { cache: 'no-store' });
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const data = await res.json();
                        this.newsList = Array.isArray(data.items) ? data.items : [];
                        this.generatedAt = data.generatedAt || null;
                    } catch (e) {
                        console.error('Failed to load news.json', e);
                        this.newsList = [];
                    } finally {
                        this.loading = false;
                    }
                },

                get heroItem() {
                    return this.newsList.length ? this.newsList[0] : null;
                },

                get lastUpdatedLabel() {
                    if (!this.generatedAt) return this.lang === 'bn' ? 'লাইভ সংবাদ পোর্টাল' : 'Live news portal';
                    const label = this.lang === 'bn' ? 'সবশেষ আপডেট' : 'Last updated';
                    return `${label}: ${this.timeAgo(this.generatedAt)}`;
                },

                selectCategory(id) {
                    this.selectedCategory = id;
                    this.visibleCount = 24;
                },

                availableCategories() {
                    const present = new Set(this.newsList.map(n => n.category));
                    return Object.keys(this.categoryMeta)
                        .filter(id => present.has(id))
                        .map(id => ({
                            id,
                            en: this.categoryMeta[id].en,
                            bn: (this.newsList.find(n => n.category === id) || {}).categoryBn || id,
                            icon: this.categoryMeta[id].icon,
                        }));
                },

                categoryCount(id) {
                    return this.newsList.filter(n => n.category === id).length;
                },

                categoryIcon(id) {
                    return (this.categoryMeta[id] && this.categoryMeta[id].icon) || 'fa-solid fa-newspaper';
                },

                categoryColor(id) {
                    return (this.categoryMeta[id] && this.categoryMeta[id].color) || 'bg-slate-700';
                },

                categoryEn(id) {
                    return (this.categoryMeta[id] && this.categoryMeta[id].en) || id;
                },

                filteredNews() {
                    const q = this.searchQuery.trim().toLowerCase();
                    return this.newsList.filter(item => {
                        const matchesCat = this.selectedCategory === 'all' || item.category === this.selectedCategory;
                        if (!matchesCat) return false;
                        if (!q) return true;
                        return (item.title + ' ' + item.summary + ' ' + item.source).toLowerCase().includes(q);
                    });
                },

                visibleNews() {
                    return this.filteredNews().slice(0, this.visibleCount);
                },

                timeAgo(dateStr) {
                    if (!dateStr) return '';
                    const then = new Date(dateStr).getTime();
                    if (isNaN(then)) return '';
                    const diffSec = Math.max(0, Math.floor((Date.now() - then) / 1000));
                    const bn = this.lang === 'bn';
                    if (diffSec < 60) return bn ? 'এইমাত্র' : 'just now';
                    const diffMin = Math.floor(diffSec / 60);
                    if (diffMin < 60) return bn ? `${diffMin} মিনিট আগে` : `${diffMin}m ago`;
                    const diffHr = Math.floor(diffMin / 60);
                    if (diffHr < 24) return bn ? `${diffHr} ঘণ্টা আগে` : `${diffHr}h ago`;
                    const diffDay = Math.floor(diffHr / 24);
                    if (diffDay < 30) return bn ? `${diffDay} দিন আগে` : `${diffDay}d ago`;
                    return new Date(dateStr).toLocaleDateString(bn ? 'bn-BD' : 'en-US');
                },
            };
        }
    </script>

    <!-- Full Article Reader Modal -->
    <div x-show="activeArticle" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md overflow-y-auto" @keydown.escape.window="closeModal()">
        <div class="bg-white dark:bg-slate-900 w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col border border-slate-200 dark:border-slate-800 relative animate-fade-in" @click.away="closeModal()">
            <!-- Modal Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50">
                <div class="flex items-center space-x-2">
                    <span class="bg-emerald-600 text-white text-xs font-bold px-3 py-1 rounded-full" x-text="lang === 'bn' ? (activeArticle ? activeArticle.categoryBn : '') : (activeArticle ? activeArticle.category : '')"></span>
                    <span class="text-xs font-semibold text-slate-500 dark:text-slate-400" x-text="activeArticle ? activeArticle.source : ''"></span>
                </div>
                <button @click="closeModal()" class="bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-white w-9 h-9 rounded-full flex items-center justify-center font-bold transition cursor-pointer">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            <!-- Modal Body -->
            <div class="p-6 sm:p-8 overflow-y-auto space-y-6 flex-1 text-slate-800 dark:text-slate-100">
                <h2 class="text-xl sm:text-2xl lg:text-3xl font-extrabold leading-tight font-serif-title" x-text="activeArticle ? activeArticle.title : ''"></h2>
                
                <div class="flex items-center space-x-4 text-xs text-slate-500 dark:text-slate-400 font-medium pb-4 border-b border-slate-100 dark:border-slate-800">
                    <span><i class="fa-regular fa-clock mr-1.5"></i> <span x-text="activeArticle ? activeArticle.pubDate : ''"></span></span>
                    <span><i class="fa-solid fa-shield-halved mr-1.5 text-emerald-600"></i> <span x-text="lang === 'bn' ? 'বাংলাদেশ নিউজ হাব ভেরিফাইড ইন-সাইট নিউজ' : 'Verified In-Site Report'"></span></span>
                </div>

                <div class="h-64 sm:h-80 w-full rounded-2xl overflow-hidden shadow-md" x-show="activeArticle && activeArticle.image">
                    <img :src="activeArticle ? activeArticle.image : ''" :alt="activeArticle ? activeArticle.title : ''" class="w-full h-full object-cover">
                </div>

                <div class="prose dark:prose-invert max-w-none text-base sm:text-lg leading-relaxed space-y-4" x-html="activeArticle ? (activeArticle.content || activeArticle.summary) : ''"></div>
            </div>
            <!-- Modal Footer -->
            <div class="px-6 py-4 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
                <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400" x-text="lang === 'bn' ? '✓ সম্পূর্ণ সংবাদ এই ওয়েবসাইটের ভেতরেই পঠিত' : '✓ Full news read entirely on-site'"></span>
                <button @click="closeModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl text-sm font-extrabold transition shadow-md cursor-pointer">
                    <span x-text="lang === 'bn' ? 'বন্ধ করুন (Close)' : 'Close'"></span>
                </button>
            </div>
        </div>
    </div>

</body>
</html>
